user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 15m; # product image uploads via Backend

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── doshmukti.com — Frontend (storefront) ──────────────────────────────────
  server {
    listen 80;
    server_name doshmukti.com www.doshmukti.com;
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name doshmukti.com www.doshmukti.com;

    ssl_certificate     /etc/letsencrypt/live/doshmukti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doshmukti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # ── api.doshmukti.com — Backend (Fastify) ──────────────────────────────────
  server {
    listen 80;
    server_name api.doshmukti.com;
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.doshmukti.com;

    ssl_certificate     /etc/letsencrypt/live/doshmukti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doshmukti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── admin.doshmukti.com — Admin panel ──────────────────────────────────────
  server {
    listen 80;
    server_name admin.doshmukti.com;
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name admin.doshmukti.com;

    ssl_certificate     /etc/letsencrypt/live/doshmukti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doshmukti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
